
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online FastFood Express - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="signup-container">
        <div class="signup-card">
            <div class="logo">
                <img src="../Login page/LOGO.png" alt="FastFood Express Logo">
                <h1>FastFood Express</h1>
            </div>
            <p class="subtitle">Order Fast. Eat Fresh.</p>
            <h2>Welcome Back!</h2>
            <p class="description">
                Login to your account and enjoy delicious food!
            </p>
            <form id="loginForm">
                <label for="loginInput">
                    Email or Phone Number
                </label>
                <input
                    type="text"
                    id="loginInput"
                    placeholder="Enter Email or Phone Number"
                    required
                >
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Your Password"
                    required
                >
                <button type="submit" class="signup-btn">
                    Login
                </button>
            </form>
            <p id="message"></p>
            <p class="login-text">
                New User?
                <a href="../Login page/Sin up/signup.html">Create New Account</a>
            </p>
            <p class="footer">
                © 2026 Online FastFood Express
            </p>
        </div>
    </div>
    <script type="module" src="login.js"></script>
</body>
</html>

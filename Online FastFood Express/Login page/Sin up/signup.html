<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online FastFood Express - Create Account</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="signup-container">
        <div class="signup-card">
            <div class="brand-logo">
    <img src="../LOGO.png">
    <h1>FastFood Express</h1>
</div>
            <p class="subtitle">Order Fast. Eat Fresh.</p>
            <h2>Create New Account</h2>
            <p class="description">
                Create your account and enjoy delicious food!
            </p>
            <form id="signupForm">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName"
                    placeholder="Enter First Name" required>
                <label for="middleName">Middle Name</label>
                <input type="text" id="middleName"
                    placeholder="Enter Middle Name">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName"
                    placeholder="Enter Last Name" required>
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                    placeholder="Enter 10 Digit Mobile Number"
                    pattern="[0-9]{10}" maxlength="10" required>
                <label for="email">Email Address</label>
                <input type="email" id="email"
                    placeholder="Enter Email Address" required>
                <label for="password">Password</label>
                <input type="password" id="password"
                    placeholder="Create Password" minlength="6" required>
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                    placeholder="Confirm Your Password" minlength="6" required>
                <label for="birthDate">Date of Birth</label>
                <input type="date" id="birthDate" required>
                <label for="address">Full Address</label>
                <textarea id="address"
                    placeholder="Enter Your Full Address"
                    rows="4" required></textarea>
<button
    type="button" class="signup-btn" onclick="window.location.href='../home/index.html'">
    Create Account
            </button>
            </form>
            <p id="message"></p>
            <p class="login-text">
                Already have an account?
                <a href="../login.html">Login Now</a>
            </p>
            <p class="footer">
                © 2026 Online
